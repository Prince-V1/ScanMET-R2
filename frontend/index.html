<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScanMET</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8ff;
font-family:Arial;color:#111;padding:24px}.app{max-width:900px;
margin:auto}.top{display:flex;justify-content:space-between;
align-items:center;margin-bottom:25px}.logo{font-size:30px;
font-weight:900}.nav button{margin-left:7px}.card{background:#fff;
padding:22px;border:3px solid #111;border-radius:22px;
box-shadow:6px 6px #111;margin-bottom:20px}.hero{font-size:38px;
font-weight:900;max-width:600px}.sub{color:#555}.upload{padding:25px;
border:2px dashed #777;border-radius:16px;text-align:center;
margin:18px 0}.btn{border:2px solid #111;background:#a88cff;
padding:12px 18px;border-radius:12px;font-weight:bold;cursor:pointer}
.btn.dark{background:#111;color:white}.grid{display:grid;
grid-template-columns:1fr 1fr;gap:12px}.field{padding:15px;
background:#f5f2ff;border-radius:14px}.ok{color:#15803d}.warn{color:#c2410c}
pre{white-space:pre-wrap;max-height:220px;overflow:auto}
.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}
.hero{font-size:30px}body{padding:14px}}
</style></head>
<body><main class="app">

<header class="top"><div class="logo">◉ ScanMET</div>
<div class="nav"><button class="btn" onclick="history()">History</button>
<button class="btn" onclick="location.reload()">Home</button></div></header>

<section class="card"><div class="hero">Scan now.<br>Check anytime.</div>
<p class="sub">AI-assisted packaged-label compliance screening.</p>
<div class="upload"><input id="file" type="file" accept="image/*">
<p>Upload a product label image</p>
<button class="btn dark" onclick="scan()">Scan Product</button></div>
</section>

<section id="result" class="card hidden"></section>
<section id="history" class="card hidden"></section>

<script>
const API="http://127.0.0.1:8000";
let last=null;

async function scan(){
 const f=document.getElementById("file").files[0];
 if(!f)return alert("Select a label image first.");
 result.classList.remove("hidden");
 result.innerHTML="<h2>Scanning...</h2><p>OCR + rule checking in progress.</p>";
 const body=new FormData();body.append("file",f);
 const r=await fetch(API+"/scan",{method:"POST",body});
 last=await r.json();show(last);
}

function show(d){
 let cls=d.status==="COMPLIANT"?"ok":"warn";
 let html=`<h2 class="${cls}">${d.status}</h2><div class="grid">`;
 for(let k in d.fields)html+=`<div class="field"><b>${k}</b><br>${d.fields[k]}</div>`;
 html+="</div><h3>Correction Suggestions</h3>";
 html+=d.issues.length?d.issues.map(x=>"⚠️ "+x+"<br>").join(""):"✓ No detected issues";
 html+=`<h3>OCR Text</h3><pre>${d.ocr_text||"No text detected"}</pre>`;
 html+=`<button class="btn dark" onclick="pdf()">Export PDF Report</button>`;
 result.innerHTML=html;
}

async function pdf(){
 if(!last)return;
 const r=await fetch(API+"/report",{method:"POST",
 headers:{"Content-Type":"application/json"},body:JSON.stringify(last)});
 const b=await r.blob(),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="ScanMET_Report.pdf";a.click();
}

async function history(){
 result.classList.add("hidden");historyBox.classList.remove("hidden");
 const r=await fetch(API+"/history"),d=await r.json();
 historyBox.innerHTML="<h2>Recent Scans</h2>"+
 d.map(x=>`<div class="field"><b>#${x.id} ${x.status}</b><br>${x.issues||"No issues"}</div><br>`).join("");
}
</script></main></body></html>
